<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bune — Inventario de Hardware</title>
<link rel="manifest" href="manifest-bune.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-1.png">
<link rel="apple-touch-icon" href="icon-192-1.png">
<meta name="theme-color" content="#0d0b08">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#0d0b08;
    --bg-vignette: radial-gradient(ellipse at 50% -10%, #241c10 0%, #0d0b08 55%);
    --surface:#171310;
    --surface-hover:#1e1811;
    --line:#2c2416;
    --gold:#c9973f;
    --gold-bright:#e8b969;
    --gold-dim:#8a6f3a;
    --bone:#e8dfc8;
    --bone-dim:#8f8570;
    --ember:#c2542c;
    --pending:#4a4438;
    --progress:#7a8a4a;
    --done:#4a8a5c;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--bg);
    background-image:var(--bg-vignette);
    color:var(--bone);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    padding-bottom:4rem;
  }

  /* subtle scale texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.05;
    background-image:
      repeating-linear-gradient(120deg, transparent 0 18px, var(--gold) 18px 19px, transparent 19px 40px),
      repeating-linear-gradient(60deg, transparent 0 18px, var(--gold) 18px 19px, transparent 19px 40px);
    z-index:0;
  }

  header{
    position:relative;
    z-index:1;
    padding:3rem 1.5rem 2rem;
    text-align:center;
    border-bottom:1px solid var(--line);
  }

  .seal{
    width:84px;
    height:84px;
    margin:0 auto 1rem;
    background-image:url('icon-192-1.png');
    background-size:cover;
    filter:drop-shadow(0 0 18px rgba(201,151,63,.35));
  }

  h1{
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size:clamp(2rem, 6vw, 3rem);
    letter-spacing:.08em;
    margin:0;
    color:var(--gold-bright);
    text-shadow:0 0 30px rgba(232,185,105,.25);
  }

  .subtitle{
    font-family:'Cinzel', serif;
    font-weight:500;
    letter-spacing:.15em;
    text-transform:uppercase;
    font-size:.7rem;
    color:var(--gold-dim);
    margin-top:.6rem;
  }

  .tagline{
    color:var(--bone-dim);
    font-size:.8rem;
    margin-top:1rem;
    max-width:32rem;
    margin-left:auto;
    margin-right:auto;
    line-height:1.6;
  }

  main{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:2rem 1.25rem;
  }

  .stats{
    display:flex;
    justify-content:center;
    gap:1.5rem;
    margin-bottom:2.5rem;
    flex-wrap:wrap;
  }
  .stat{
    text-align:center;
  }
  .stat-num{
    font-family:'Cinzel',serif;
    font-size:1.4rem;
    font-weight:700;
    color:var(--gold-bright);
  }
  .stat-label{
    font-size:.62rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--bone-dim);
  }

  .grid{
    display:grid;
    gap:.9rem;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    padding:1.1rem 1.2rem;
    display:flex;
    align-items:center;
    gap:1rem;
    transition:border-color .15s ease, background .15s ease, transform .15s ease;
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:var(--pending);
  }
  .card[data-status="progreso"]::before{ background:var(--progress); }
  .card[data-status="completo"]::before{ background:var(--done); }

  .card:hover, .card:focus-visible{
    border-color:var(--gold-dim);
    background:var(--surface-hover);
    outline:none;
  }
  .card:active{ transform:scale(.99); }

  .card-icon{
    font-size:1.5rem;
    width:2.2rem;
    text-align:center;
    flex-shrink:0;
    opacity:.85;
  }

  .card-body{
    flex:1;
    min-width:0;
  }

  .card-name{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:1rem;
    color:var(--bone);
    letter-spacing:.02em;
  }

  .card-model{
    font-size:.72rem;
    color:var(--bone-dim);
    margin-top:.15rem;
  }

  .card-status{
    font-size:.62rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:.25rem .55rem;
    border-radius:3px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .card[data-status="pendiente"] .card-status{ color:var(--pending); border:1px solid var(--pending); }
  .card[data-status="progreso"] .card-status{ color:var(--progress); border:1px solid var(--progress); }
  .card[data-status="completo"] .card-status{ color:var(--done); border:1px solid var(--done); }

  .section-label{
    font-family:'Cinzel', serif;
    font-size:.68rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin:2.2rem 0 .8rem;
    padding-bottom:.5rem;
    border-bottom:1px solid var(--line);
  }
  .section-label:first-of-type{ margin-top:0; }

  /* Detail overlay */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(5,4,2,.85);
    backdrop-filter:blur(3px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
  }
  .overlay.open{ display:flex; }

  .sheet{
    background:var(--surface);
    border:1px solid var(--gold-dim);
    border-bottom:none;
    border-radius:14px 14px 0 0;
    max-width:640px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:1.6rem 1.4rem 2.2rem;
    animation:slideUp .2s ease;
  }
  @keyframes slideUp{
    from{ transform:translateY(20px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }

  .sheet-handle{
    width:36px; height:4px;
    background:var(--line);
    border-radius:2px;
    margin:0 auto 1.2rem;
  }

  .sheet h2{
    font-family:'Cinzel', serif;
    color:var(--gold-bright);
    font-size:1.3rem;
    margin:0 0 .3rem;
  }
  .sheet .sheet-model{
    color:var(--bone-dim);
    font-size:.78rem;
    margin-bottom:1.2rem;
  }

  .spec-row{
    display:flex;
    justify-content:space-between;
    gap:1rem;
    padding:.55rem 0;
    border-bottom:1px solid var(--line);
    font-size:.82rem;
  }
  .spec-row:last-child{ border-bottom:none; }
  .spec-key{ color:var(--bone-dim); flex-shrink:0; }
  .spec-val{ color:var(--bone); text-align:right; }
  .spec-val.warn{ color:var(--ember); }

  .empty-note{
    color:var(--bone-dim);
    font-size:.8rem;
    text-align:center;
    padding:1.5rem 0;
    line-height:1.7;
  }

  .close-btn{
    display:block;
    margin:1.4rem auto 0;
    background:none;
    border:1px solid var(--line);
    color:var(--bone-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:.6rem 1.4rem;
    border-radius:4px;
    cursor:pointer;
  }
  .close-btn:hover{ border-color:var(--gold-dim); color:var(--gold-dim); }

  footer{
    text-align:center;
    color:var(--bone-dim);
    font-size:.65rem;
    letter-spacing:.05em;
    margin-top:3rem;
    opacity:.6;
  }
</style>
</head>
<body>

<header>
  <div class="seal"></div>
  <h1>Bune</h1>
  <div class="subtitle">Inventario de Hardware</div>
  <p class="tagline">Registro del equipo de Chucho — torre, laptop, periféricos y móvil. Toca cualquier pieza para ver sus specs.</p>
</header>

<main>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Piezas</div></div>
    <div class="stat"><div class="stat-num" id="stat-done">0</div><div class="stat-label">Completas</div></div>
    <div class="stat"><div class="stat-num" id="stat-pending">0</div><div class="stat-label">Pendientes</div></div>
  </div>

  <div class="section-label">Cómputo</div>
  <div class="grid" id="grid-computo"></div>

  <div class="section-label">Periféricos</div>
  <div class="grid" id="grid-perifericos"></div>

  <div class="section-label">Móvil</div>
  <div class="grid" id="grid-movil"></div>

  <footer>Bune_RigInventory · actualizado manualmente</footer>
</main>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheet-name"></h2>
    <div class="sheet-model" id="sheet-model"></div>
    <div id="sheet-specs"></div>
    <button class="close-btn" onclick="closeSheet()">Cerrar</button>
  </div>
</div>

<script>
/* =========================================================
   DATOS — editar aquí cada vez que se complete una pieza.
   status: "pendiente" | "progreso" | "completo"
   specs: lista de [etiqueta, valor]. Usa "—" si falta el dato.
   ========================================================= */
const DEVICES = {
  computo: [
    {
      id:"torre",
      icon:"🖥️",
      name:"Torre — Legion T7 34IAS10",
      model:"90Y80000US",
      status:"progreso",
      specs:[
        ["CPU","Intel Core Ultra 9 285K (24 threads)"],
        ["GPU","RTX 5090 32GB"],
        ["RAM","64GB DDR5"],
        ["Almacenamiento","Samsung NVMe 2TB (MZVL22T0HDLB-00BLL)"],
        ["Red","Realtek 2.5GbE + Intel Wi-Fi 6E AX211"],
        ["Bluetooth","Intel Wireless"],
        ["PSU","—"],
        ["Gabinete / color","—"],
        ["Fecha de compra","—"]
      ]
    },
    {
      id:"laptop",
      icon:"💻",
      name:"Laptop — Legion LOQ 15IAX9",
      model:"83GS",
      status:"progreso",
      specs:[
        ["CPU","⚠️ i5-12450HX o i7-14700HX — confirmar cuál"],
        ["GPU","RTX 4050 6GB"],
        ["RAM","⚠️ 16–24GB DDR5 — confirmar valor exacto"],
        ["Almacenamiento","⚠️ SSD M.2 PCIe Gen4 512GB–1TB — confirmar"],
        ["Pantalla","⚠️ 15.6\" FHD 144Hz o WQHD 165Hz — confirmar"],
        ["Fecha de compra","—"]
      ]
    }
  ],
  perifericos: [
    { id:"monitor", icon:"🖼️", name:"Monitor", model:"ASUS ROG Strix XG32WCS", status:"pendiente", specs:[] },
    { id:"teclado", icon:"⌨️", name:"Teclado", model:"Lenovo Legion K500 RGB Mechanical", status:"pendiente", specs:[] },
    { id:"mouse", icon:"🖱️", name:"Mouse", model:"Lenovo USB Optical Mouse", status:"pendiente", specs:[] },
    { id:"control", icon:"🎮", name:"Control", model:"Xbox Series X Advanced Wired Controller", status:"pendiente", specs:[] },
    { id:"audio-bt", icon:"🎧", name:"Audífonos Bluetooth", model:"Sony WH-CH520", status:"pendiente", specs:[] },
    { id:"audio-usb", icon:"🎧", name:"Audífonos USB", model:"Corsair HS80 RGB", status:"pendiente", specs:[] },
    { id:"webcam", icon:"📷", name:"Webcam", model:"Anker PowerConf C200 (2K)", status:"pendiente", specs:[] },
    { id:"hub", icon:"🔌", name:"Hub USB-C", model:"Anker 555 (8-in-1)", status:"pendiente", specs:[] }
  ],
  movil: [
    { id:"pixel", icon:"📱", name:"Móvil", model:"Google Pixel 9 Pro", status:"pendiente", specs:[] }
  ]
};

function statusLabel(s){
  return { pendiente:"Pendiente", progreso:"En progreso", completo:"Completo" }[s] || s;
}

function renderGrid(containerId, items){
  const el = document.getElementById(containerId);
  el.innerHTML = items.map(d => `
    <div class="card" data-status="${d.status}" tabindex="0" onclick="openSheet('${d.id}')" onkeypress="if(event.key==='Enter')openSheet('${d.id}')">
      <div class="card-icon">${d.icon}</div>
      <div class="card-body">
        <div class="card-name">${d.name}</div>
        <div class="card-model">${d.model}</div>
      </div>
      <div class="card-status">${statusLabel(d.status)}</div>
    </div>
  `).join("");
}

function allDevices(){
  return [...DEVICES.computo, ...DEVICES.perifericos, ...DEVICES.movil];
}

function renderStats(){
  const all = allDevices();
  document.getElementById("stat-total").textContent = all.length;
  document.getElementById("stat-done").textContent = all.filter(d=>d.status==="completo").length;
  document.getElementById("stat-pending").textContent = all.filter(d=>d.status==="pendiente").length;
}

function openSheet(id){
  const d = allDevices().find(x=>x.id===id);
  if(!d) return;
  document.getElementById("sheet-name").textContent = d.name;
  document.getElementById("sheet-model").textContent = d.model;
  const specsEl = document.getElementById("sheet-specs");
  if(d.specs.length === 0){
    specsEl.innerHTML = `<div class="empty-note">Sin datos cargados todavía.<br>Se completará cuando trabajemos esta pieza.</div>`;
  } else {
    specsEl.innerHTML = d.specs.map(([k,v]) => `
      <div class="spec-row">
        <span class="spec-key">${k}</span>
        <span class="spec-val ${v.includes('⚠️') ? 'warn' : ''}">${v}</span>
      </div>
    `).join("");
  }
  document.getElementById("overlay").classList.add("open");
}

function closeSheet(){
  document.getElementById("overlay").classList.remove("open");
}

document.getElementById("overlay").addEventListener("click", e=>{
  if(e.target.id === "overlay") closeSheet();
});

renderGrid("grid-computo", DEVICES.computo);
renderGrid("grid-perifericos", DEVICES.perifericos);
renderGrid("grid-movil", DEVICES.movil);
renderStats();
</script>

</body>
</html>
